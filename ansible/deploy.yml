---
- name: Deploy ConverterApp to replicas (pull + run)
  hosts: replicas
  become: true
  gather_facts: true
  serial: 1   # rolling deploy: one replica at a time

  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_image: "{{ app_image | default('rpgleonce/converterapp-image:latest') }}"
    container_name: "converterapp-container"
    host_port: 5000
    container_port: 80
    dockerhub_user: "{{ lookup('env', 'DOCKERHUB_USER') }}"
    dockerhub_pass: "{{ lookup('env', 'DOCKERHUB_PASS') }}"
    db_secret_name: "{{ lookup('env','DB_SECRET_NAME') | default('converterapp/rds', true) }}"
    db_host: "converterapp-db.c8h0syswkbi9.us-east-1.rds.amazonaws.com"
    db_user: "admin"
    db_name: "converterApp"

  tasks:
    - name: Install Docker (Amazon Linux / RHEL family)
      ansible.builtin.yum:
        name: docker
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Install pip for Python 3
      ansible.builtin.yum:
        name: python3-pip
        state: present

    - name: Install Python Docker SDK (user site to avoid rpm conflicts)
      ansible.builtin.pip:
        name: docker
        extra_args: --user

    - name: Read DB secret from Secrets Manager (controller only)
      shell: aws secretsmanager get-secret-value \
        --secret-id "converterapp/rds" \
        --query SecretString \
        --output text
      register: secret_out
      changed_when: false
      delegate_to: localhost
      run_once: true

    - name: Parse DB secret
      set_fact:
        db_secret: "{{ secret_out.stdout | from_json }}"
        db_password: "{{ (secret_out.stdout | from_json).password }}"
      run_once: true

    - name: Login to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_user }}"
        password: "{{ dockerhub_pass }}"
      when:
        - dockerhub_user | length > 0
        - dockerhub_pass | length > 0

    - name: Pull the application image
      community.docker.docker_image:
        name: "{{ app_image }}"
        source: pull

    - name: Stop old container if running
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: stopped
      ignore_errors: true

    - name: Remove old container if present
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Run container (restart always)
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ app_image }}"
        state: started
        restart_policy: always
        published_ports:
          - "{{ host_port }}:{{ container_port }}"
        env:
          DB_HOST: "converterapp-db.c8h0syswkbi9.us-east-1.rds.amazonaws.com"
          DB_NAME: "converterApp"
          DB_USER: "admin"
          DB_PASS: "{{ db_password }}"

    - name: Basic health check (HTTP 200 expected)
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200